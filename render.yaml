# Render Blueprint: one web service (API + dashboard in a single image) and one Postgres database.
# Apply with "New → Blueprint" in the Render dashboard. An existing Docker web service pointed at ./Dockerfile
# is equivalent; add the database and ConnectionStrings__Postgres to it by hand.
services:
  - type: web
    name: tradingscanner
    repo: https://github.com/ethanhockey1211-lgtm/Crypto-insane-.git
    branch: claude/crypto-trading-scanner-ymspes
    # Render waits for the GitHub Actions checks before rebuilding this live service.
    autoDeployTrigger: checksPass
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: tradingscanner-db
          property: connectionString
      # Optional. Enables the AI narrative; never exposed to the browser.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional private stock scanner: set Stocks__ApiKey, Stocks__ApiSecret and a separate
      # 24+ character Stocks__AccessToken in this service's Environment settings, then redeploy.
      # See docs/stock-signal-setup.md. Never add their values to the repository.

databases:
  - name: tradingscanner-db
    plan: basic-256mb
    postgresMajorVersion: "16"
