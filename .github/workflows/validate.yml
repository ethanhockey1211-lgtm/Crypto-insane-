name: Validate scanner
on:
  pull_request:
  push:
    branches: ["main", "claude/crypto-trading-scanner-ymspes"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scanner_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: scanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner_test -d scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TS_TEST_POSTGRES: Host=localhost;Port=5432;Username=scanner_test;Password=ephemeral_ci_only;Database=scanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_OUTPUT: export
